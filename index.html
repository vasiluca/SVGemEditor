<!DOCTYPE html>
<html>

<head>
	<title>SVG Drawing App (Development)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1" />
	<link rel="stylesheet" href="./app.css" />
	<!--link(href='./libs/fonts/material/material-icons.css' rel='stylesheet')-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css?family=Montserrat|Roboto|Roboto+Condensed:300,400|Open+Sans+Condensed:300|Barlow+Semi+Condensed"
		rel="stylesheet" />
	<script src="./libs/jquery.js"></script>
	<!--TODO: including type="module" for the script tag appears to cause the application to glitch. This needs to be resolved-->
	
	<!-- type="module" allows support for es6 module imports and exports -->
	<script nomodule>
		alert("Your browser does not support modules!"); // this alert will occur when modules is not supported
	</script>
</head>

<body>
	<a id="redirect" style="display: block; text-align: center; margin: 0 auto; max-width: 300px; padding: 75px 0; font-size: 20px; position: relative; z-index: 200" 
		href="./dist/app.html">Open SVGem Application at /SVGemEditor/dist/app.html</a>

	<iframe id="SVGemApp" title="SVGem Application" data-src="./dist/app.html"></iframe>
	<style>
		iframe {
			width: 100vw;
			height: 100vh;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			border: none;
			z-index: 100;
		}
	</style>
	<script>
		// force refresh the iframe to show the latest version
		let appFrame = document.querySelector('#SVGemApp');
		let src = appFrame.getAttribute('data-src');
		appFrame.src = src + '?t=' + new Date().getTime();

		// hide the redirect link after iframe successfully loaded
		let redirect = document.querySelector('#redirect');
		redirect.style.display = 'none'; 

	</script>
</body>	

</html>
